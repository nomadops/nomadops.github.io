<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:17px;line-height:1.6;color:var(--text);background:var(--ground)}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.sw i{display:block;height:56px;border-radius:6px;border:1px solid var(--line)}
.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw small{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0}</style></head><body><div style="display:flex;gap:16px">
<div style="flex:1;padding:28px;background:var(--paper);border:1px solid var(--line);border-radius:10px"><div style="font-family:var(--font-mono);font-size:.875rem;text-transform:uppercase;color:var(--accent-text);margin-bottom:12px">02 · MCP</div><h3 style="font-size:1.375rem;line-height:1.25;margin-bottom:12px">MCP servers for your app</h3><div class="lbl">paper · 1px #d9ddd9 · r10 · p28</div></div>
<div style="flex:1;padding:32px;background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:12px;color:var(--on-ink)"><h3 style="font-size:1.75rem;line-height:1.2;letter-spacing:-0.01em">HeyPenny</h3><div style="font-family:var(--font-mono);font-size:.875rem;color:var(--accent);margin:4px 0 12px">General-purpose fixer agent</div><div class="lbl" style="color:var(--on-ink-subtle)">ink-raised · 1px #2a3640 · r12 · p32</div></div></div></body></html>
