<!-- @dsCard group="Colors" viewport="700x150" subtitle="Orange on dark; darker accent-text on light" name="Accent" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:17px;line-height:1.6;color:var(--text);background:var(--ground)}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.sw i{display:block;height:56px;border-radius:6px;border:1px solid var(--line)}
.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw small{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0}</style></head><body><div class="row">
<div class="sw"><i style="background:var(--accent)"></i><b>accent</b><small>#e8862e</small></div><div class="sw"><i style="background:var(--accent-hover)"></i><b>accent-hover</b><small>#f09a4a</small></div><div class="sw"><i style="background:var(--accent-text)"></i><b>accent-text</b><small>#9a4a0c</small></div>
<div class="sw" style="flex:2"><i style="background:var(--ink);display:flex;align-items:center;justify-content:center;gap:16px;color:var(--accent);font-family:var(--font-mono);font-size:13px;text-transform:uppercase">eyebrow on dark</i><b>Usage</b><small>accent on ink · accent-text on light</small></div>
<div class="sw" style="flex:2"><i style="background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--accent-text);font-family:var(--font-mono);font-size:13px;text-transform:uppercase">eyebrow on light</i><b>&nbsp;</b><small>&nbsp;</small></div></div></body></html>
