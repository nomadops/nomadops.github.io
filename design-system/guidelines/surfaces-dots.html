<!-- @dsCard group="Surfaces" viewport="700x150" subtitle="8px dots; 3px focus outline" name="Status dots & focus" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:17px;line-height:1.6;color:var(--on-ink);background:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.sw i{display:block;height:56px;border-radius:6px;border:1px solid var(--ink-line)}
.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw small{font-family:var(--font-mono);font-size:11px;color:var(--on-ink-subtle)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--on-ink-subtle)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0}</style></head><body><div style="display:flex;gap:32px;align-items:center;flex-wrap:wrap;font-size:15px">
<span style="display:flex;align-items:center;gap:10px"><i style="width:8px;height:8px;border-radius:50%;background:#ff9b8a;display:inline-block"></i>dot-fail</span><span style="display:flex;align-items:center;gap:10px"><i style="width:8px;height:8px;border-radius:50%;background:#e8862e;display:inline-block"></i>dot-accent</span><span style="display:flex;align-items:center;gap:10px"><i style="width:8px;height:8px;border-radius:50%;background:#2e8b76;display:inline-block"></i>dot-ok</span><span style="display:flex;align-items:center;gap:10px"><i style="width:8px;height:8px;border-radius:50%;background:#c2410c;display:inline-block"></i>dot-warn</span>
<span style="margin-left:auto;padding:0 16px;min-height:44px;display:inline-flex;align-items:center;background:var(--accent);color:var(--ink);border-radius:6px;font-weight:600;outline:3px solid var(--accent);outline-offset:2px">:focus-visible</span></div></body></html>
