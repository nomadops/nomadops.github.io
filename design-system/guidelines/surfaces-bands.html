<!-- @dsCard group="Surfaces" viewport="700x150" subtitle="dark ink → ground → white band with hairlines" name="Page bands" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:17px;line-height:1.6;color:var(--text);background:var(--ground)}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.sw i{display:block;height:56px;border-radius:6px;border:1px solid var(--line)}
.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw small{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0}</style></head><body><div style="display:flex;flex-direction:column;gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--line)">
<div style="background:var(--ink);color:var(--on-ink-muted);padding:14px 16px;font-size:13px">.dark — #0e1418</div>
<div style="background:var(--ground);padding:14px 16px;font-size:13px">.section — ground #f3f4f1</div>
<div style="background:var(--paper);border-block:1px solid var(--line);padding:14px 16px;font-size:13px">.band — paper with 1px #d9ddd9 top/bottom</div></div></body></html>
