<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:17px;line-height:1.6;color:var(--text);background:var(--ground)}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.sw i{display:block;height:56px;border-radius:6px;border:1px solid var(--line)}
.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw small{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0}</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px;font-family:var(--font-mono)">
<div style="color:var(--accent-text);font-size:.875rem;letter-spacing:.04em;text-transform:uppercase">Agentic DevOps · SRE · MCP servers</div>
<div style="color:var(--accent-text);font-size:.875rem;text-transform:uppercase">01 · Agents</div>
<div style="font-size:.875rem;color:var(--on-ink-muted);background:var(--ink-raised);padding:8px 12px;border-radius:6px;display:inline-block;align-self:flex-start"><span style="color:var(--accent)">→</span> mcp: your-app.get_health</div>
<div style="display:flex;gap:8px"><span style="padding:6px 12px;background:var(--chip);border:1px solid var(--line);border-radius:999px;font-size:.875rem">Terraform</span><span style="padding:6px 12px;background:var(--chip);border:1px solid var(--line);border-radius:999px;font-size:.875rem">Pulumi</span></div></div>
<div class="lbl" style="margin-top:10px">eyebrow .875rem uppercase .04em · card-label .875rem uppercase · log .875rem/1.85 · tags .875rem</div></body></html>
