<!-- @dsCard group="Colors" viewport="700x150" subtitle="Ground, paper, tint, chip, lines, text" name="Light surfaces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:17px;line-height:1.6;color:var(--text);background:var(--ground)}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.sw i{display:block;height:56px;border-radius:6px;border:1px solid var(--line)}
.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw small{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0}</style></head><body><div class="row">
<div class="sw"><i style="background:var(--ground)"></i><b>ground</b><small>#f3f4f1</small></div><div class="sw"><i style="background:var(--paper)"></i><b>paper</b><small>#ffffff</small></div><div class="sw"><i style="background:var(--paper-tint)"></i><b>paper-tint</b><small>#f7f8f6</small></div><div class="sw"><i style="background:var(--chip)"></i><b>chip</b><small>#edefec</small></div><div class="sw"><i style="background:var(--line)"></i><b>line</b><small>#d9ddd9</small></div><div class="sw"><i style="background:var(--input-line)"></i><b>input-line</b><small>#7e8a85</small></div><div class="sw"><i style="background:var(--text-muted)"></i><b>text-muted</b><small>#47535b</small></div><div class="sw"><i style="background:var(--text)"></i><b>text</b><small>#0e1418</small></div></div></body></html>
