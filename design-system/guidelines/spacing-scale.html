<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Gutters, section padding, grid gaps, card padding" name="Spacing" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:17px;line-height:1.6;color:var(--text);background:var(--ground)}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.sw i{display:block;height:56px;border-radius:6px;border:1px solid var(--line)}
.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw small{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px 24px;font-size:14px">
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span>--gutter</span><span class="lbl">clamp(16px, 4vw, 24px)</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span>--gap-wide</span><span class="lbl">clamp(32px, 6vw, 56px)</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span>section padding-block</span><span class="lbl">clamp(64px, 10vw, 96px)</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span>grid gap</span><span class="lbl">20px</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span>card padding</span><span class="lbl">28px</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span>agent padding</span><span class="lbl">32px</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span>container</span><span class="lbl">1200px</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span>nav padding-block</span><span class="lbl">18px</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span>section-head margin-bottom</span><span class="lbl">48px</span></div></div></body></html>
