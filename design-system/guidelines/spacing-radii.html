<!-- @dsCard group="Spacing" viewport="700x160" subtitle="6 / 8 / 10 / 12 / 999px, 1px hairlines, no shadows" name="Radii & borders" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:17px;line-height:1.6;color:var(--text);background:var(--ground)}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.sw i{display:block;height:56px;border-radius:6px;border:1px solid var(--line)}
.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw small{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0}</style></head><body><div style="display:flex;gap:20px;align-items:flex-end">
<div style="text-align:center;flex:1"><div style="height:56px;background:var(--paper);border:1px solid var(--line);border-radius:6px"></div><div class="lbl" style="margin-top:6px">btn / input<br>6px</div></div><div style="text-align:center;flex:1"><div style="height:56px;background:var(--paper);border:1px solid var(--line);border-radius:8px"></div><div class="lbl" style="margin-top:6px">rows / flow-step<br>8px</div></div><div style="text-align:center;flex:1"><div style="height:56px;background:var(--paper);border:1px solid var(--line);border-radius:10px"></div><div class="lbl" style="margin-top:6px">card<br>10px</div></div><div style="text-align:center;flex:1"><div style="height:56px;background:var(--paper);border:1px solid var(--line);border-radius:12px"></div><div class="lbl" style="margin-top:6px">agent / terminal / form<br>12px</div></div><div style="text-align:center;flex:1"><div style="height:56px;background:var(--paper);border:1px solid var(--line);border-radius:999px"></div><div class="lbl" style="margin-top:6px">pill / badge / tag<br>999px</div></div></div></body></html>
