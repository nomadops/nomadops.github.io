<!-- @dsCard group="Colors" viewport="700x150" subtitle="ok / warn / fail / error" name="Status" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:17px;line-height:1.6;color:var(--text);background:var(--ground)}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.sw i{display:block;height:56px;border-radius:6px;border:1px solid var(--line)}
.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw small{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0}</style></head><body><div class="row">
<div class="sw"><i style="background:var(--ok)"></i><b>ok</b><small>#2e8b76</small></div><div class="sw"><i style="background:var(--ok-on-ink)"></i><b>ok-on-ink</b><small>#7cc9b5</small></div><div class="sw"><i style="background:var(--warn)"></i><b>warn</b><small>#c2410c</small></div><div class="sw"><i style="background:var(--fail-on-ink)"></i><b>fail-on-ink</b><small>#ff9b8a</small></div><div class="sw"><i style="background:var(--error)"></i><b>error</b><small>#b42318</small></div><div class="sw"><i style="background:var(--error-bg)"></i><b>error-bg</b><small>#fef3f2</small></div></div></body></html>
