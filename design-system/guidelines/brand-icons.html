<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:17px;line-height:1.6;color:var(--on-ink);background:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.sw i{display:block;height:56px;border-radius:6px;border:1px solid var(--ink-line)}
.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw small{font-family:var(--font-mono);font-size:11px;color:var(--on-ink-subtle)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--on-ink-subtle)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0}</style></head><body><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
<span style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;color:var(--accent);background:var(--ink);border:1px solid var(--ink-line-strong);border-radius:10px"><img src="../assets/icons/agent-fixer.svg" width="24" height="24" style="filter:invert(62%) sepia(60%) saturate(900%) hue-rotate(345deg)" alt="agent-fixer"></span><span style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;color:var(--accent);background:var(--ink);border:1px solid var(--ink-line-strong);border-radius:10px"><img src="../assets/icons/agent-debugger.svg" width="24" height="24" style="filter:invert(62%) sepia(60%) saturate(900%) hue-rotate(345deg)" alt="agent-debugger"></span><span style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;color:var(--accent);background:var(--ink);border:1px solid var(--ink-line-strong);border-radius:10px"><img src="../assets/icons/agent-pipelines.svg" width="24" height="24" style="filter:invert(62%) sepia(60%) saturate(900%) hue-rotate(345deg)" alt="agent-pipelines"></span>
<span style="font-family:var(--font-mono);font-size:1.25rem;display:flex;gap:20px;margin-left:16px"><span style="color:var(--accent)">→</span><span style="color:var(--ok-on-ink)">✓</span><span style="color:var(--fail-on-ink)">✗</span><span style="color:var(--on-ink-subtle)">·</span></span>
<div class="lbl" style="margin-left:auto">agent-fixer · agent-debugger · agent-pipelines</div></div></body></html>
