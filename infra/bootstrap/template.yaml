AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time bootstrap for nomadops.io infrastructure: the GitHub Actions OIDC provider,
  the roles Pulumi assumes from CI, and the S3 bucket that holds Pulumi state.
  Applied once from a laptop; everything else is Pulumi, run from GitHub Actions.

Parameters:
  GitHubRepo:
    Type: String
    Default: nomadops/nomadops.github.io
    Description: owner/name of the repository whose workflows may assume the roles.
  StateBucketName:
    Type: String
    Description: Globally unique name for the Pulumi state bucket, for example nomadops-pulumi-state.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # AWS validates GitHub's issuer against its own trust store; the API still requires a value.
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  PulumiStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref StateBucketName
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # `pulumi up` on pushes to main. Broad on purpose: it creates buckets, distributions,
  # certificates, functions, tables and IAM roles. Trust is what limits it: only this
  # repository's main branch can assume it, for an hour at a time.
  InfraDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nomadops-infra-deploy
      Description: Pulumi up from GitHub Actions on main.
      MaxSessionDuration: 3600
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AdministratorAccess]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal: { Federated: !Ref GitHubOidcProvider }
            Condition:
              StringEquals: { "token.actions.githubusercontent.com:aud": sts.amazonaws.com }
              StringLike: { "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:ref:refs/heads/main" }

  # `pulumi preview` on pull requests: read-only on AWS, plus the state bucket (previews take a lock).
  InfraPreviewRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nomadops-infra-preview
      Description: Pulumi preview from GitHub Actions on pull requests.
      MaxSessionDuration: 3600
      ManagedPolicyArns: [arn:aws:iam::aws:policy/ReadOnlyAccess]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal: { Federated: !Ref GitHubOidcProvider }
            Condition:
              StringEquals: { "token.actions.githubusercontent.com:aud": sts.amazonaws.com }
              StringLike: { "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:pull_request" }
      Policies:
        - PolicyName: pulumi-state
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt PulumiStateBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${PulumiStateBucket.Arn}/*"

Outputs:
  OidcProviderArn: { Value: !Ref GitHubOidcProvider }
  InfraDeployRoleArn: { Value: !GetAtt InfraDeployRole.Arn }
  InfraPreviewRoleArn: { Value: !GetAtt InfraPreviewRole.Arn }
  PulumiStateBucket: { Value: !Ref PulumiStateBucket }
