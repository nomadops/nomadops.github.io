name: CI
on: { pull_request: {} }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci && npm run build && npm run check
      - name: Fail if _site contains a script tag
        run: |
          if grep -rn "<script" _site/; then
            echo "::error::_site/ contains a <script> tag. The site ships zero client-side JavaScript."
            exit 1
          fi
  contact-backend:
    runs-on: ubuntu-26.04
    defaults: { run: { working-directory: infra/contact } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: npm ci && npm test && npm run typecheck
